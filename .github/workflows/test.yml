name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile tablet.py layout.py install.py scripts/*.py
